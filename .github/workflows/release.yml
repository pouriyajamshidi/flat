name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      # Fails early if CHANGELOG.md has no "## <tag>" section
      - name: Extract release notes
        run: |
          awk -v heading="## $GITHUB_REF_NAME" '$0 == heading {found=1; next} /^## /{found=0} found' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "No '## $GITHUB_REF_NAME' section in CHANGELOG.md"; exit 1; }

      - name: Install eBPF build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev

      - name: Build
        run: make release

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" flat_linux_*.tar.gz checksums.txt --notes-file notes.md
