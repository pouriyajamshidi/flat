name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to release, e.g. v0.6.0. The tag is created on the selected branch if it does not exist."
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      # Fails early if CHANGELOG.md has no "## <tag>" section
      - name: Extract release notes
        run: |
          awk -v heading="## $TAG" '$0 == heading {found=1; next} /^## /{found=0} found' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "No '## $TAG' section in CHANGELOG.md"; exit 1; }

      - name: Install eBPF build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev

      - name: Build
        run: make release

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" flat_linux_*.tar.gz checksums.txt --notes-file notes.md --target "$GITHUB_SHA"
